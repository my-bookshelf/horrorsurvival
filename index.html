<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Midnight Labyrinth</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#d9d2c5;font:17px 'Cormorant Garamond',Georgia,serif;color-scheme:dark}
#w{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#050607}
@media(orientation:portrait){#w{width:100vh;width:100dvh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}}
canvas{position:absolute;inset:0;width:100%;height:100%}
#w::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 150px 34px rgba(0,0,0,.78)}
#fx{position:absolute;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)'/%3E%3C/svg%3E");animation:gr .5s steps(4) infinite}
@keyframes gr{25%{background-position:-30px 20px}50%{background-position:40px -30px}75%{background-position:-20px -40px}}
.sub{font-style:italic;color:#b3a27c;margin:-2px 0 10px;letter-spacing:.12em}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% -10%,#3a0e18 0,#0c1013 52%,#020304 100%);overflow:auto;padding:8px}
#end{background:rgba(0,0,0,.82)}
.card{width:min(640px,96%);text-align:center;padding:16px 20px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));border:1px solid rgba(214,174,106,.3);box-shadow:0 24px 60px #000c,inset 0 1px 0 rgba(255,255,255,.1);backdrop-filter:blur(10px)}
h1{font:700 30px Cinzel,Georgia,serif;margin:0 0 4px;letter-spacing:.16em;background:linear-gradient(180deg,#f6e2b4 10%,#c0243c 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #7a1020)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:6px 0}
label{display:flex;flex-direction:column;font:600 10px Cinzel,Georgia,serif;letter-spacing:.1em;text-transform:uppercase;text-align:left;gap:3px;color:#c4ad7c}
input:focus,select:focus{outline:none;border-color:#d6ae6a;box-shadow:0 0 0 3px rgba(214,174,106,.18)}
input,select{background:rgba(0,0,0,.45);border:1px solid rgba(214,174,106,.28);color:#f1e7d0;padding:8px 10px;border-radius:10px;font:600 16px 'Cormorant Garamond',Georgia,serif;letter-spacing:0;text-transform:none;-webkit-user-select:text;user-select:text}
button{font:600 12px Cinzel,Georgia,serif;letter-spacing:.14em;color:#f6e2b4;background:linear-gradient(180deg,#7a1424,#3d070e);border:1px solid #d6ae6a;border-radius:12px;padding:11px 18px;margin:4px;box-shadow:0 6px 18px #000a,inset 0 1px 0 rgba(255,255,255,.22);transition:transform .12s}
button:active{transform:scale(.96)}
details{border:1px solid rgba(214,174,106,.2);border-radius:12px;padding:8px;margin:8px 0;background:rgba(0,0,0,.22)}summary{font:600 11px Cinzel,Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:#d6ae6a}
#er_{color:#e55;min-height:18px;font-size:13px}
#hud{position:absolute;inset:0;pointer-events:none}#hud>*{pointer-events:auto}
.ic{position:absolute;width:64px;height:64px;border-radius:50%;padding:0;font-size:26px;background:rgba(12,8,10,.55);border:1px solid rgba(214,174,106,.55);backdrop-filter:blur(6px);box-shadow:0 4px 18px #000a,inset 0 1px 0 rgba(255,255,255,.12);margin:0}
#bk{left:calc(14px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));width:46px;height:46px;font-size:20px}
#bf{right:calc(30px + env(safe-area-inset-right));bottom:104px;background:conic-gradient(#ffd96a calc(var(--p,100)*1%),#2a1a1a 0);padding:5px}
#bf b,#bh b{display:flex;width:100%;height:100%;border-radius:50%;background:#140c0c;align-items:center;justify-content:center;font-weight:400}
#bh{right:calc(30px + env(safe-area-inset-right));bottom:24px;background:conic-gradient(#7fe9a3 calc(var(--q,100)*1%),#2a1a1a 0);padding:5px}
#tm{position:absolute;left:50%;top:calc(6px + env(safe-area-inset-top));transform:translateX(-50%);font:46px Creepster,fantasy;color:#ff3b55;text-shadow:0 0 18px #a00,0 2px 6px #000;pointer-events:none}
#obj{position:absolute;left:calc(70px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));font-size:17px;text-shadow:0 1px 4px #000;pointer-events:none;max-width:40%}
#msg{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);font:26px Creepster,fantasy;color:#e8d8c0;text-shadow:0 0 8px #000;pointer-events:none;text-align:center}
#pad{position:absolute;left:calc(50px + env(safe-area-inset-left));bottom:34px;width:130px;height:130px;border-radius:50%;border:2px solid rgba(214,174,106,.6);background:radial-gradient(rgba(255,255,255,.08),rgba(0,0,0,.3));box-shadow:0 0 26px #000a}
#pad::before{content:'';position:absolute;inset:-50px}
#nub{position:absolute;left:33px;top:33px;width:64px;height:64px;border-radius:50%;background:radial-gradient(#fff,#cdbb94);box-shadow:0 2px 10px #000a}
#ll div{padding:8px 14px;margin:5px auto;max-width:360px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(214,174,106,.18)}
</style></head><body><div id="w">
<canvas id="cv"></canvas><div id="fx"></div>
<div id="hud" hidden>
<button class="ic" id="bk">⮌</button><div id="obj"></div><div id="tm"></div><div id="msg"></div>
<div id="pad"><i id="nub"></i></div>
<button class="ic" id="bf"><b>🔦</b></button><button class="ic" id="bh"><b>🏃</b></button></div>

<div id="menu" class="ov"><div class="card"><h1>MIDNIGHT LABYRINTH</h1><div class="sub">survive the dark, together</div>
<div class="g"><label>Your name<input id="nm" maxlength="12" value="Survivor"></label><label>Room code<input id="cd" maxlength="8" placeholder="e.g. BONES"></label></div>
<details open><summary>Host settings (used when you create a room)</summary><div class="g">
<label>Mode<select id="sm"><option value="s">Survive the time</option><option value="e">Escape with items</option></select></label>
<label>Time (minutes)<input id="st" type="number" value="5" min="1" max="30"></label>
<label>Monsters<input id="sn" type="number" value="1" min="1" max="4"></label>
<label>Max players (survivors = max − monsters)<input id="sx" type="number" value="6" min="2" max="12"></label>
<label>Items to find (Escape)<input id="si" type="number" value="4" min="2" max="8"></label>
<label>Flashlight<select id="sf"><option value="1">With charge (runs out)</option><option value="2">Unlimited</option><option value="0">Off (pure darkness)</option></select></label><label>Run button<select id="sg"><option value="1">With charge (runs out)</option><option value="2">Unlimited</option><option value="0">Off</option></select></label>
<label>Killed survivors<select id="sk"><option value="1">Become monsters</option><option value="0">Are out</option></select></label>
<label>Who becomes the monster<select id="sr"><option value="r">Random player</option><option value="h">Host picks in lobby</option><option value="a">AI only (all players survive)</option></select></label><label>AI survivors (extra)<input id="sb" type="number" value="0" min="0" max="8"></label><label>Solo vs AI: I play as<select id="sy"><option value="s">Survivor</option><option value="m">Monster</option><option value="r">Random</option></select></label><label>AI difficulty<select id="sd"><option value="0.85">Easy</option><option value="1" selected>Normal</option><option value="1.2">Hard</option></select></label></div></details>
<div id="er_"></div>
<button id="ba">PLAY VS AI (solo)</button><button id="bc">CREATE ROOM</button><button id="bj">JOIN ROOM</button>
<div style="font-size:11px;color:#777">Online rooms need everyone signed in to claude.ai with access to this page. Landscape play: joystick on the left, buttons on the right.</div></div></div>

<div id="lobby" class="ov" hidden><div class="card"><h1>THE HOUSE AWAITS</h1>
<div style="font-size:13px;color:#9a948a">Room code</div><div id="lc" style="font:700 38px Cinzel,Georgia,serif;letter-spacing:.3em;color:#f6e2b4;text-shadow:0 0 18px #a0203a"></div>
<div id="li" style="font-size:13px;margin:6px"></div><div id="ll"></div>
<button id="bs">START GAME</button><button id="bl">LEAVE</button></div></div>

<div id="end" class="ov" hidden><div class="card"><h1 id="et"></h1><div id="er"></div><div id="ew" style="margin:8px"></div>
<button id="eb">BACK TO LOBBY (host)</button><button id="bq">LEAVE</button></div></div>
</div>
<script>
const $=i=>document.getElementById(i),S=56,C=22,N=C*3+1,EM=['🔑','⚙️','🔋','🕯️','💎','📜','🧪','🔧'];
let R,G=null,me,P=[],K={},myp,joined=0,au,jx=0,jy=0,pid=null,rn=0;const kk={};
const cv=$('cv'),x=cv.getContext('2d'),dk=document.createElement('canvas'),d=dk.getContext('2d');
let dpr=1,LW=800,LH=400;
function rs(){dpr=Math.min(devicePixelRatio||1,2);LW=$('w').clientWidth;LH=$('w').clientHeight;cv.width=dk.width=LW*dpr;cv.height=dk.height=LH*dpr}
addEventListener('resize',rs);rs();
const er=t=>{$('er_').textContent=t||''};
function show(s){['menu','lobby','end'].forEach(i=>$(i).hidden=i!==s);$('hud').hidden=s!=='game'}
let mt;function msg(t,ms=2200){$('msg').textContent=t;clearTimeout(mt);mt=setTimeout(()=>$('msg').textContent='',ms)}
/* ---------- audio ---------- */
function A(){try{if(!au){au=new(window.AudioContext||window.webkitAudioContext)();const o=au.createOscillator(),g=au.createGain(),f=au.createBiquadFilter();o.type='sawtooth';o.frequency.value=41;f.type='lowpass';f.frequency.value=140;g.gain.value=.05;o.connect(f);f.connect(g);g.connect(au.destination);o.start();const l=au.createOscillator(),lg=au.createGain();l.frequency.value=.13;lg.gain.value=40;l.connect(lg);lg.connect(f.frequency);l.start()}au.resume()}catch(e){}}
function tn(f,t,g,ty,f2){if(!au)return;const n=au.currentTime,o=au.createOscillator(),v=au.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+t);v.gain.setValueAtTime(g,n);v.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(v);v.connect(au.destination);o.start();o.stop(n+t)}
/* ---------- map ---------- */
function mk(seed){let s=seed>>>0;const r=()=>{s=s+1831565813|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},T=new Uint8Array(N*N).fill(1);
const cell=(i,j)=>{for(let a=0;a<2;a++)for(let b=0;b<2;b++)T[(3*j+1+b)*N+3*i+1+a]=0},D=[[1,0],[-1,0],[0,1],[0,-1]],
lk=(i,j,e)=>{for(let a=0;a<2;a++){const X=e[0]?(e[0]>0?3*i+3:3*i):3*i+1+a,Y=e[1]?(e[1]>0?3*j+3:3*j):3*j+1+a;T[Y*N+X]=0}},
v=new Uint8Array(C*C),st=[[0,0]],cp=(i,j)=>[(3*i+2)*S,(3*j+2)*S];v[0]=1;cell(0,0);
while(st.length){const[i,j]=st[st.length-1],nb=D.map(e=>[i+e[0],j+e[1],e]).filter(q=>q[0]>=0&&q[1]>=0&&q[0]<C&&q[1]<C&&!v[q[1]*C+q[0]]);
if(!nb.length){st.pop();continue}const[a,b,e]=nb[r()*nb.length|0];v[b*C+a]=1;cell(a,b);lk(i,j,e);st.push([a,b])}
for(let k=0;k<150;k++){const i=r()*C|0,j=r()*C|0,e=D[r()*4|0];if(i+e[0]>=0&&j+e[1]>=0&&i+e[0]<C&&j+e[1]<C)lk(i,j,e)}
for(let k=0;k<20;k++){const i=r()*(C-1)|0,j=r()*(C-1)|0;for(let a=0;a<5;a++)for(let b=0;b<5;b++)T[(3*j+1+b)*N+3*i+1+a]=0}
const sv=cp(C>>1,C>>1),it=[];while(it.length<8){const t=(r()*N*N)|0;if(T[t])continue;const p=[(t%N+.5)*S,((t/N|0)+.5)*S];if(Math.hypot(p[0]-sv[0],p[1]-sv[1])>700&&it.every(q=>Math.hypot(q[0]-p[0],q[1]-p[1])>500))it.push(p)}
return{T,it,sv,ex:cp(C-1,C-1),ms:[cp(0,0),cp(C-1,0),cp(0,C-1)]}}
const wl=(px,py)=>G.m.T[(py/S|0)*N+(px/S|0)],blk=(px,py)=>wl(px-14,py-14)||wl(px+14,py-14)||wl(px-14,py+14)||wl(px+14,py+14);
function mv(o,dx,dy){if(!blk(o.x+dx,o.y))o.x+=dx;if(!blk(o.x,o.y+dy))o.y+=dy}
function nxt(fx,fy,tx,ty){const T=G.m.T,a=(fy/S|0)*N+(fx/S|0),b=(ty/S|0)*N+(tx/S|0);if(a===b||T[b])return[tx,ty];const pr=new Int16Array(N*N).fill(-1);pr[a]=a;const q=[a];
for(let h=0;h<q.length&&pr[b]<0;h++){const c=q[h];for(const o of[1,-1,N,-N]){const n=c+o;if(n>=0&&n<N*N&&!T[n]&&pr[n]<0&&!(Math.abs(o)===1&&(n/N|0)!==(c/N|0))){pr[n]=c;q.push(n)}}}
if(pr[b]<0)return[tx,ty];let c=b;while(pr[c]!==a)c=pr[c];return[(c%N+.5)*S,((c/N|0)+.5)*S]}
/* ---------- room / lobby ---------- */
const hostP=()=>R&&R.peers().find(p=>p.presence.host);
const rcfg=()=>({md:$('sm').value,t:+$('st').value||5,mon:Math.min(4,Math.max(1,+$('sn').value||1)),max:Math.max(2,+$('sx').value||6),n:Math.min(8,Math.max(2,+$('si').value||4)),fl:+$('sf').value,cv:+$('sk').value,df:+$('sd').value||1,rm:$('sr').value,sb:Math.min(8,Math.max(0,+$('sb').value||0)),rn:+$('sg').value,sy:$('sy').value});
async function go(host){A();try{document.documentElement.requestFullscreen?.().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}
const code=($('cd').value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!code)return er('Enter a room code.');
const rm=await claude.use('room');if(!rm)return er('Online play needs a signed-in claude.ai viewer.');
er('Connecting…');R=await rm.join('lab-'+code);joined=1;R.onPeers(onP);await new Promise(r=>setTimeout(r,1800));
const hp=hostP(),n=($('nm').value||'Survivor').slice(0,12);
if(host){if(hp)return fail('That code is already in use.');await R.presence({host:1,phase:'lobby',cfg:rcfg(),n})}
else{if(!hp)return fail('No room found with that code.');if(hp.presence.phase!=='lobby')return fail('That game already started.');if(R.peers().length>hp.presence.cfg.max)return fail('The room is full.');await R.presence({n})}
myp=R.peers().find(p=>p.sameTab).peer;joined=2;er('');$('cd').value=code;show('lobby');onP()}
function fail(t){R.leave();R=null;joined=0;er(t)}
function bye(t){try{R.leave()}catch(e){}R=null;G=null;joined=0;show('menu');er(t||'')}
function onP(){if(!R)return;P=R.peers();const hp=hostP();if(joined!==2)return;if(!hp)return bye('The host left.');const q=hp.presence;
if(G&&q.phase==='lobby'){G=null;show('lobby')}else if(!G&&q.phase==='play')begin(hp);
if(!G)lobbyUI(hp)}
function lobbyUI(hp){const c=hp.presence.cfg;$('lc').textContent=$('cd').value;$('li').textContent=`${c.md==='s'?'Survive':'Escape'} · ${c.mon} monster(s) · ${c.max-c.mon} survivors max · ${c.t} min · flashlight ${['off','with charge','unlimited'][c.fl]} · monster: ${{r:'random',h:'host picks',a:'AI only'}[c.rm||'r']} · ${c.sb||0} AI survivors${c.rm==='h'&&hp.sameTab?' (tap a player to make them a monster)':''}`;
$('ll').replaceChildren(...P.filter(p=>p.kind==='viewer').map(p=>{const e=document.createElement('div');const pm=hp.presence.pm||[];e.textContent=(pm.includes(p.peer)?'👹 ':p.presence.host?'👑 ':'👤 ')+(p.presence.n||'?')+(p.isMe?' (you)':'');if(hp.sameTab&&c.rm==='h'){e.style.cursor='pointer';e.onclick=()=>R.presence({pm:pm.includes(p.peer)?pm.filter(q=>q!==p.peer):[...pm,p.peer]})}return e}));$('bs').hidden=!hp.sameTab}
function start(){const hq=hostP().presence,ps=R.peers().filter(p=>p.kind==='viewer'),c=hq.cfg,roles={};let ids;if(c.solo)ids=(c.sy==='r'?Math.random()<.5:c.sy==='m')?[ps[0].peer]:[];else if(c.rm==='a')ids=[];else if(c.rm==='h')ids=(hq.pm||[]).filter(i=>ps.some(p=>p.peer===i));else{ps.sort(()=>Math.random()-.5);ids=ps.slice(0,Math.min(c.mon,ps.length-(c.sb?0:1))).map(p=>p.peer)}ids=ids.slice(0,c.mon);const sbn=c.sb||(c.solo&&ids.length?2:0);if(ids.length>=ps.length&&!sbn)ids.pop();ps.forEach(p=>roles[p.peer]=ids.includes(p.peer)?'m':'s');
R.presence({phase:'play',seed:Math.random()*1e9|0,t0:Date.now()+4000,roles,nb:c.mon-ids.length,sb:sbn})}
function begin(hp){const q=hp.presence,cf=q.cfg,m=mk(q.seed),role=q.roles[myp]||'d',ks=Object.keys(q.roles),ix=ks.indexOf(myp),sp=role==='m'?m.ms[Math.max(0,ix)%3]:m.sv;
G={cfg:cf,t0:q.t0,m,roles:q.roles,bots:[],dur:cf.t*60,over:0,sc:0,hb:1,tm:0,dg:0,hu:0,pt:0};K={};
me={x:sp[0]+(Math.random()-.5)*50,y:sp[1]+(Math.random()-.5)*50,a:role,ang:0,f:0,bat:1,st:1,sl:0,rr:0,lock:0,h:0,ht:0,cd:0,got:[],k:[]};
if(hp.sameTab){for(let i=0;i<(q.nb||0);i++){const p=m.ms[i%3];G.bots.push({x:p[0],y:p[1],rp:0,n:p,t:2})}for(let i=0;i<(q.sb||0);i++)G.bots.push({s:1,a:'s',t:1,x:m.sv[0]+(i%4-1.5)*30,y:m.sv[1]+((i/4|0)-.5)*30,rp:0,n:m.sv,f:0,g:0})}
$('bf').hidden=!(cf.fl&&role==='s');$('bh').hidden=!(cf.rn&&role!=='d');
$('obj').textContent=role==='m'?'Hunt them down.':role==='d'?'Spectating':cf.md==='s'?'Survive until the time runs out.':'';
R.presence({a:role,x:me.x|0,y:me.y|0,got:[],k:[],f:0,h:0,g:0});show('game');A();
msg(role==='m'?'YOU ARE THE MONSTER':'RUN. HIDE.',3000)}
/* ---------- gameplay ---------- */
function die(){me.a=G.cfg.cv?'m':'d';me.f=0;me.h=0;G.sc=1.5;tn(900,1.2,.5,'sawtooth',50);tn(120,1.4,.6,'square',30);if(navigator.vibrate)navigator.vibrate([200,80,300]);$('bf').hidden=true;$('bh').hidden=!(G.cfg.rn&&me.a==='m');msg(me.a==='m'?'YOU HAVE TURNED…':'YOU DIED',3000)}
const tf=()=>{if(G&&me.a==='s'&&G.cfg.fl&&!me.lock&&me.bat>.05&&!me.h){me.f=me.f?0:1;tn(300,.05,.15,'square')}};

function kill(o){(G.bl||[]).forEach((b,i)=>{if(b.t===1&&Math.hypot(b.x-o.x,b.y-o.y)<30&&!me.k.includes('#'+i))me.k.push('#'+i)});P.forEach(p=>{const q=p.presence;if(q.a==='s'&&!q.h&&(o!==me||!p.sameTab)&&!me.k.includes(p.peer)&&Math.hypot(q.x-o.x,q.y-o.y)<30)me.k.push(p.peer)})}
